org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

kotlin.code.style=official
kotlin.mpp.applyDefaultHierarchyTemplate=true
# iOS targets are declared for the macOS build host; on Linux they are simply
# not assembled. This keeps `assembleDebug`/desktop builds warning-free there.
kotlin.native.ignoreDisabledTargets=true

android.useAndroidX=true
android.nonTransitiveRClass=true

compose.experimental.jscanvas.enabled=false
