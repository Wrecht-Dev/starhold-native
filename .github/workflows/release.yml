name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v (e.g. 1.0.0)"
        required: true

permissions:
  contents: write

env:
  VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  android:
    name: Android APK + AAB
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/starhold-release.keystore"
          {
            echo "STARHOLD_KEYSTORE_PATH=$RUNNER_TEMP/starhold-release.keystore"
            echo "STARHOLD_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "STARHOLD_KEY_ALIAS=$KEY_ALIAS"
            echo "STARHOLD_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build release APK and AAB
        run: >-
          ./gradlew :composeApp:assembleRelease :composeApp:bundleRelease
          -PstarholdVersion="$VERSION" -PstarholdVersionCode="${GITHUB_RUN_NUMBER}"
          --console=plain

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp composeApp/build/outputs/apk/release/*.apk "dist/Starhold-${VERSION#v}.apk"
          cp composeApp/build/outputs/bundle/release/*.aab "dist/Starhold-${VERSION#v}.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: starhold-android
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux deb + rpm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - name: Install rpmbuild
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Package
        run: ./gradlew :composeApp:packageDeb :composeApp:packageRpm -PstarholdVersion="$VERSION" --console=plain

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp composeApp/build/compose/binaries/main/deb/*.deb dist/
          cp composeApp/build/compose/binaries/main/rpm/*.rpm dist/

      - uses: actions/upload-artifact@v4
        with:
          name: starhold-linux
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS dmg
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - name: Package
        run: ./gradlew :composeApp:packageDmg -PstarholdVersion="$VERSION" --console=plain

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp composeApp/build/compose/binaries/main/dmg/*.dmg dist/

      - uses: actions/upload-artifact@v4
        with:
          name: starhold-macos
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows msi
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - name: Package
        shell: bash
        run: ./gradlew :composeApp:packageMsi -PstarholdVersion="$VERSION" --console=plain

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp composeApp/build/compose/binaries/main/msi/*.msi dist/

      - uses: actions/upload-artifact@v4
        with:
          name: starhold-windows
          path: dist/*
          if-no-files-found: error

  ios:
    name: iOS simulator app (unsigned)
    runs-on: macos-latest
    # Signing for devices/TestFlight needs an Apple team; this job produces an
    # unsigned simulator .app so the build is at least verified in CI.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - name: Build simulator app
        run: |
          xcodebuild \
            -project iosApp/Starhold.xcodeproj \
            -scheme Starhold \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath "$RUNNER_TEMP/ios-build" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Collect artifacts
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/ios-build/Build/Products/Release-iphonesimulator/Starhold.app" \
            "dist/Starhold-${VERSION#v}-ios-simulator.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: starhold-ios
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [android, linux, macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -lh dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Starhold ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: false
