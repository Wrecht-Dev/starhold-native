name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests, Android APK, desktop compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Core tests, APK and desktop compile
        run: ./gradlew :core:desktopTest :composeApp:assembleDebug :composeApp:compileKotlinDesktop --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: starhold-debug-apk
          path: composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
